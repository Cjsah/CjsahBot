plugins {
    id 'maven-publish'
    id 'io.freefair.lombok' version '9.5.0'
}

base {
    archivesName.set(rootProject.name + '-core')
}

repositories {
    maven {
        name 'mojang'
        url 'https://libraries.minecraft.net'
    }
}

dependencies {
//    implementation project(":api")
    api("org.java-websocket:Java-WebSocket:$websocket_version") {
        exclude group: 'org.slf4j'
    }
    api("org.quartz-scheduler:quartz:$quartz_version") {
        exclude group: 'com.zaxxer'
        exclude group: 'com.mchange'
        exclude group: 'org.slf4j'
    }

    api "it.unimi.dsi:fastutil:${fastutil_version}"

    api "com.mojang:datafixerupper:${project.codec_version}"

}

lombok {
    version = lombok_version
}

tasks.register('copyJar', Copy) {
    from configurations.runtimeClasspath
    into 'build/libs/lib'
}

tasks.register('sourcesJar', Jar) {
    dependsOn classes
    archiveClassifier = 'sources'
    from sourceSets.main.allSource
}

tasks.register('docJar', Jar) {
    dependsOn javadoc
    archiveClassifier = 'javadoc'
    from javadoc.destinationDir
}

jar.dependsOn([copyJar])

jar {
    from("LICENSE")
    manifest {
        attributes([
                "Main-Class": "net.cjsah.bot.MainApplication",
                "Class-Path": configurations.runtimeClasspath.files.collect { "lib/$it.name" }.join(' ')
        ])
    }

    doLast {
        def builtJarName = archiveFileName.get()
        copy {
            from(rootProject.file('scripts'))
            into(destinationDirectory)
            filteringCharset = 'UTF-8'
            // Replace placeholder token in script templates with the actual jar filename.
            filter { String line -> line.replace('$filename$', builtJarName) }
        }
        copy {
            from("README.md")
            into(destinationDirectory)
        }
    }

}

tasks.register('runMain', JavaExec) {
    group = "application"
    description = "Runs the main class"
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'net.cjsah.bot.Main'

    File runDir = rootProject.file("run")

    // 在任务执行之前检查并创建工作目录
    doFirst {
        if (!runDir.exists()) {
            runDir.mkdirs()
        }
    }

    // 设置运行目录
    workingDir = runDir

    // 如果需要传递 JVM 参数或程序参数，可以在这里添加
    // jvmArgs = listOf("-Xmx512m")
    // args = listOf("arg1", "arg2")
}
repositories {
    mavenCentral()
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId 'CjsahBot-core'
            from components.java
            artifact sourcesJar
            artifact docJar

            pom {
                name = 'CjsahBot-core'
                description = "CjsahBot"
                url = "https://github.com/Cjsah/CjsahBot"

                licenses {
                    license {
                        name = "The Apache License, Version 2.0"
                        url = "https://apache.ac.cn/licenses/LICENSE-2.0.txt"
                    }
                }
                developers {
                    developer {
                        name = "Cjsah"
                        email = "cjsah@cjsah.net"
                    }
                }
            }
        }
    }

    def ENV = System.getenv()
    if (ENV.MAVEN_URL) {
        repositories.maven {
            url ENV.MAVEN_URL
            credentials {
                username ENV.MAVEN_USERNAME
                password ENV.MAVEN_PASSWORD
            }
        }
    }
}